<script>
const uploadArea = document.querySelector(".upload-area");
const uploadBtn = document.querySelector(".upload-btn");
const fileInput = document.getElementById("fileInput");

let selectedFile = null;

/* =========================
   UPLOAD BUTTON
========================= */

uploadBtn.addEventListener("click", function(e) {
    e.preventDefault();
    e.stopPropagation();
    fileInput.click();
});


/* =========================
   FILE SELECT
========================= */

fileInput.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    selectedFile = file;

    console.log("Image selected:", file.name);

    // Show selected image
    const imageURL = URL.createObjectURL(file);

    const originalImage = document.getElementById("originalImage");

    if (originalImage) {
        originalImage.src = imageURL;
    }

    // Show result section if available
    const result = document.getElementById("result");

    if (result) {
        result.style.display = "block";
    }

    const status = document.getElementById("status");

    if (status) {
        status.textContent = "Image selected: " + file.name;
    }

    // Start background removal
    processImage(file);
});


/* =========================
   DRAG & DROP
========================= */

uploadArea.addEventListener("dragover", function(e) {
    e.preventDefault();
});

uploadArea.addEventListener("drop", function(e) {

    e.preventDefault();

    const file = e.dataTransfer.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Please select an image file.");
        return;
    }

    selectedFile = file;

    const imageURL = URL.createObjectURL(file);

    const originalImage = document.getElementById("originalImage");

    if (originalImage) {
        originalImage.src = imageURL;
    }

    processImage(file);
});


/* =========================
   BACKGROUND REMOVAL
========================= */

async function processImage(file) {

    const status = document.getElementById("status");

    if (status) {
        status.textContent = "Loading AI background remover...";
    }

    try {

        // Load AI library ONLY after image is selected
        const module = await import(
            "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm"
        );

        const removeBackground = module.default || module.removeBackground;

        if (!removeBackground) {
            throw new Error("Background removal library failed to load.");
        }

        if (status) {
            status.textContent = "Removing background... Please wait.";
        }

        const resultBlob = await removeBackground(file, {
            model: "isnet_quint8",

            progress: function(key, current, total) {

                if (total) {
                    const percent = Math.round(
                        (current / total) * 100
                    );

                    if (status) {
                        status.textContent =
                            "Processing... " + percent + "%";
                    }
                }
            }
        });

        const resultURL = URL.createObjectURL(resultBlob);

        const resultImage =
            document.getElementById("resultImage");

        if (resultImage) {
            resultImage.src = resultURL;
        }

        if (status) {
            status.textContent =
                "Background removed successfully!";
        }

        const downloadBtn =
            document.getElementById("downloadBtn");

        if (downloadBtn) {

            downloadBtn.style.display = "inline-block";

            downloadBtn.onclick = function() {

                const link = document.createElement("a");

                link.href = resultURL;
                link.download = "background-removed.png";

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);
            };
        }

    } catch (error) {

        console.error("Background removal error:", error);

        if (status) {
            status.textContent =
                "Error: " + error.message;
        }

        alert(
            "Background removal could not start. Please try again."
        );
    }
}
</script>
